# The Tauri desktop shell (cross-platform recode, Phase 2). It is its own Cargo
# workspace so the main workspace's Linux and Windows jobs never need the
# webview system libraries. See docs/cross-platform/README.md.
[package]
name = "grokhub-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]

[lib]
name = "grokhub_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "grokhub-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
grokhub-core = { path = "../crates/grokhub-core" }
grokhub-agent = { path = "../crates/grokhub-agent" }
grokhub-desktop = { path = "../crates/grokhub-desktop" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4", default-features = false, features = ["v1"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
