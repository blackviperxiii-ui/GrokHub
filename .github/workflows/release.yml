name: Release

# A stable `vX.Y.Z` tag publishes Latest. A `vX.Y.Z-beta.N` tag publishes a
# GitHub pre-release (never Latest) with the same assets. Every push to
# `beta` (each merge), a manual run on `beta` and the nightly schedule
# (~3 AM America/Chicago) publish `vX.Y.Z-beta.N` from beta (N = commits since
# the newest stable tag), so the beta updater sees each merge. A newer beta
# push cancels a build still running; the nightly skips when that tag already
# exists. Merges made with github.token start no push runs, so auto-merge needs
# AUTO_MERGE_TOKEN (see auto-merge.yml) for its merges to publish.
# Each release carries Linux and Windows builds, the Tauri shell's bundles
# (Linux and Windows; macOS on tags, the nightly and manual runs, not on beta
# pushes), `SHA256SUMS`, and
# `SHA256SUMS.minisig` (minisign via `MINISIGN_SECRET_KEY`). The public key is
# `packaging/minisign.pub`; the updater refuses unverified assets.

on:
  push:
    tags:
      - "v*"
    # Runs from beta's own copy of this file, so it works before main has it.
    branches:
      - beta
  # Schedules fire from the default branch (main); SOURCE_REF makes them build beta.
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer beta pre-release run replaces one still building; tags never cancel.
  group: release-${{ github.event_name == 'schedule' && 'refs/heads/beta' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Nightly plans beta; tags and manual runs plan their own ref. Every job
  # after plan checks out the planned SHA, so a beta push mid-run can't
  # change what ships.
  SOURCE_REF: ${{ github.event_name == 'schedule' && 'beta' || '' }}

jobs:
  # Decides whether to build. Tags always build. Beta pre-releases come from a
  # push to beta, the nightly or a manual run on beta; the nightly skips when
  # vX.Y.Z-beta.N already exists (no new beta commits since the last one).
  # Manual runs on other branches skip.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      # true for beta pushes, the nightly, manual beta runs and vX.Y.Z-beta.N tags.
      beta: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-beta.') }}
      # Shell bundle OSes. A beta push skips macOS (10x runner minutes for an
      # unsigned .dmg); tags, the nightly and manual runs build all three.
      shell_os: ${{ (github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" != schedule ] && [ "$REF" != refs/heads/beta ]; then
            echo "::notice::beta pre-releases build only from beta; skipping $REF"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ver="$(tr -d '[:space:]' < VERSION)"
          stable="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          n="$(git rev-list --count "${stable}..HEAD")"
          tag="v${ver}-beta.${n}"
          if [ "$EVENT" = schedule ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already published; nothing new on beta"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  linux-bundle:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Builds run third-party build scripts; only publish writes the release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history + tags: build.rs and the beta tag count commits since vX.Y.Z.
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      # The planned SHA checks out detached; name it beta so build.rs labels the
      # binaries `X.Y.Z-beta.N (beta @ sha)` like a beta checkout would.
      - name: Label the beta build
        if: needs.plan.outputs.beta == 'true'
        shell: bash
        run: git switch -C beta
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Build caches only on beta pushes (and manual runs on beta). Tags and
      # the nightly build cold, as before, so a release never starts from a
      # cache a beta build wrote.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: github.ref == 'refs/heads/beta'
        with:
          shared-key: linux-release
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      - run: ./scripts/make-release-bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist-release/grokhub-linux-*.tar.gz
          if-no-files-found: error

  windows-installer:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    # SignPath OSS approvals are manual; leave headroom when signing is on.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history + tags: build.rs and the beta tag count commits since vX.Y.Z.
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      # The planned SHA checks out detached; name it beta so build.rs labels the
      # binaries `X.Y.Z-beta.N (beta @ sha)` like a beta checkout would.
      - name: Label the beta build
        if: needs.plan.outputs.beta == 'true'
        shell: bash
        run: git switch -C beta
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: github.ref == 'refs/heads/beta'
        with:
          shared-key: windows-release
      - name: Inno Setup
        run: choco install innosetup --no-progress
      - name: Package
        shell: pwsh
        run: ./scripts/make-windows-release.ps1
      # Pack script locks and the release binary size ceiling (needs the
      # binary Package just built). ci.yml's windows-release runs these only
      # on the nightly now, so they gate every release here.
      - name: Pack script locks
        shell: pwsh
        run: ./scripts/make-windows-release.tests.ps1
      - name: No Electron leftover
        shell: pwsh
        run: |
          if (Test-Path package.json) { throw 'electron leftover' }
          if (Test-Path desktop) { throw 'electron leftover' }
      # Authenticode via SignPath Foundation. No-op until secrets/vars exist.
      # Only tags are signed (every beta push would spam approvals).
      - name: Detect SignPath configuration
        id: signpath-config
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          "product-version=$ver" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -ne "tag") {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "SignPath skipped: not a tag (beta branch pushes stay unsigned)."
            exit 0
          }
          $missing = @()
          foreach ($name in @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG",
            "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::SignPath skipped (unsigned Windows artifacts): missing $($missing -join ', '). See docs/CODE_SIGNING.md."
            exit 0
          }
          "enabled=true" >> $env:GITHUB_OUTPUT
          Write-Host "SignPath enabled for tag with policy '$env:SIGNPATH_SIGNING_POLICY_SLUG'."
      - name: Upload unsigned Windows artifacts for SignPath
        if: steps.signpath-config.outputs.enabled == 'true'
        id: signpath-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signpath-unsigned
          path: |
            dist-release/GrokHub-Setup-*.exe
            dist-release/grokhub-windows-v*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Submit SignPath signing request
        if: steps.signpath-config.outputs.enabled == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath-signed
          parameters: |
            version: "${{ steps.signpath-config.outputs.product-version }}"
      - name: Replace unsigned artifacts with SignPath-signed outputs
        if: steps.signpath-config.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $downloadDir = Join-Path $PWD "signpath-signed"
          if (-not (Test-Path $downloadDir)) {
            throw "Signed artifact directory '$downloadDir' was not created."
          }
          $setup = Get-ChildItem $downloadDir -Recurse -File -Filter "GrokHub-Setup-*.exe" | Select-Object -First 1
          $zip = Get-ChildItem $downloadDir -Recurse -File -Filter "grokhub-windows-v*.zip" | Select-Object -First 1
          if (-not $setup) { throw "Signed GrokHub-Setup-*.exe was not found in '$downloadDir'." }
          if (-not $zip) { throw "Signed grokhub-windows-v*.zip was not found in '$downloadDir'." }
          $outDir = Join-Path $PWD "dist-release"
          Copy-Item $setup.FullName (Join-Path $outDir $setup.Name) -Force
          Copy-Item $zip.FullName (Join-Path $outDir $zip.Name) -Force
          Write-Host "Replaced dist-release Windows artifacts with SignPath-signed outputs."
          Write-Host "Signing request: ${{ steps.signpath.outputs.signing-request-web-url }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist-release/GrokHub-Setup-*.exe
            dist-release/grokhub-windows-v*.zip
          if-no-files-found: error

  # The Tauri shell (cross-platform recode, Phase 6) ships as Tauri's own
  # bundles next to the cabin's builds; scripts/name-shell-bundles.sh gives
  # them release names. The macOS .dmg is unsigned until Apple signing exists.
  shell-bundles:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.shell_os) }}
    name: shell bundles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: github.ref == 'refs/heads/beta'
        with:
          workspaces: src-tauri
          shared-key: shell-${{ matrix.os }}
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci --prefix ui
      - name: Bundles
        shell: bash
        run: ui/node_modules/.bin/tauri build -- --locked
      - name: Release names
        shell: bash
        run: ./scripts/name-shell-bundles.sh "$RUNNER_OS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    needs: [plan, linux-bundle, windows-installer, shell-bundles]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history + tags: build.rs and the beta tag count commits since vX.Y.Z.
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true
      - name: Name the release
        id: name
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              # Semver beta pre-release: never Latest.
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::unsupported release tag '$tag' (want vX.Y.Z or vX.Y.Z-beta.N)"
              exit 1
            fi
          else
            ver="$(tr -d '[:space:]' < VERSION)"
            # Same N as build.rs (commits since the newest stable vX.Y.Z), so the
            # tag matches the binary's `X.Y.Z-beta.N` and rises with every beta commit.
            stable="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
            if [ -z "$stable" ]; then
              echo "::error::no stable vX.Y.Z tag to count beta commits from"
              exit 1
            fi
            n="$(git rev-list --count "${stable}..HEAD")"
            echo "tag=v${ver}-beta.${n}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Sign SHA256SUMS
        working-directory: dist-release
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ steps.name.outputs.tag }}
        shell: bash
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set: SHA256SUMS ships unsigned and the updater will refuse these assets."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m SHA256SUMS -t "grokhub $TAG SHA256SUMS"
          rm -f "$key"
          if grep -q '^untrusted comment: minisign public key' ../packaging/minisign.pub 2>/dev/null; then
            minisign -V -p ../packaging/minisign.pub -m SHA256SUMS
          else
            echo "::warning::packaging/minisign.pub is missing, so the signature was not checked against the shipped key."
          fi
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          prerelease: ${{ steps.name.outputs.prerelease }}
          make_latest: ${{ steps.name.outputs.prerelease == 'false' }}
          files: dist-release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install
            **Linux:** extract `grokhub-linux-v*.tar.gz` and run `./install.sh`,
            or `cargo install --path crates/grokhub-app` from a clone.

            **Windows:** run `GrokHub-Setup-*.exe` (no admin).
            Installs to `%LOCALAPPDATA%\Programs\GrokHub`.

            **GrokHub Shell (preview, Tauri):** `grokhub-shell-v*-linux-amd64.deb` or
            `.AppImage` on Linux, `GrokHub-Shell-Setup-*.exe` on Windows, and
            `grokhub-shell-v*-macos-arm64.dmg` on Apple silicon Macs (tagged and
            nightly releases; per-merge beta builds skip it). The .dmg isn't
            signed yet, so right-click the app and choose Open the first time.

            ## Verify
            `SHA256SUMS` lists every file's SHA-256 and `SHA256SUMS.minisig` signs it.
            `minisign -V -p minisign.pub -m SHA256SUMS`, then `sha256sum -c SHA256SUMS --ignore-missing`.
            The public key is `packaging/minisign.pub` in the repo. GrokHub's updater checks both before it installs.

            ## Code signing policy
            Windows release binaries may be Authenticode-signed through SignPath Foundation when configured.
            [docs/CODE_SIGNING.md](https://github.com/blackviperxiii-ui/GrokHub/blob/${{ steps.name.outputs.tag }}/docs/CODE_SIGNING.md)
