name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      - run: ./scripts/make-release-bundle.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/grokhub-linux-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install
            **Linux:** extract `grokhub-linux-${{ github.ref_name }}.tar.gz` and run `./install.sh`,
            or `cargo install --path crates/grokhub-app` from a clone.

            **Windows:** run `GrokHub-Setup-${{ github.ref_name }}.exe` (no admin).
            Installs to `%LOCALAPPDATA%\Programs\GrokHub`.

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inno Setup
        run: choco install innosetup --no-progress
      - name: Package
        shell: pwsh
        run: ./scripts/make-windows-release.ps1
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/GrokHub-Setup-*.exe
            dist-release/grokhub-windows-v*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
