name: Release

# A `v*` tag publishes a release. A push to `beta` publishes a pre-release
# (`beta-vX.Y.Z-<sha>`) with the same layout. Each one carries the Linux and
# Windows builds, `SHA256SUMS` over all of them, and `SHA256SUMS.minisig`, a
# minisign signature made with the `MINISIGN_SECRET_KEY` Actions secret. The
# matching public key is `packaging/minisign.pub`; the updater refuses any
# asset whose hash or signature doesn't verify.

on:
  push:
    tags:
      - "v*"
    branches:
      - beta

permissions:
  contents: write

concurrency:
  # A newer beta push replaces a beta pre-release still building; tags never cancel.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/beta' }}

jobs:
  linux-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      - run: ./scripts/make-release-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-release/grokhub-linux-*.tar.gz
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inno Setup
        run: choco install innosetup --no-progress
      - name: Package
        shell: pwsh
        run: ./scripts/make-windows-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist-release/GrokHub-Setup-*.exe
            dist-release/grokhub-windows-v*.zip
          if-no-files-found: error

  publish:
    needs: [linux-bundle, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Name the release
        id: name
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            ver="$(tr -d '[:space:]' < VERSION)"
            echo "tag=beta-v${ver}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Sign SHA256SUMS
        working-directory: dist-release
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ steps.name.outputs.tag }}
        shell: bash
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set: SHA256SUMS ships unsigned and the updater will refuse these assets."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m SHA256SUMS -t "grokhub $TAG SHA256SUMS"
          rm -f "$key"
          if grep -q '^untrusted comment: minisign public key' ../packaging/minisign.pub 2>/dev/null; then
            minisign -V -p ../packaging/minisign.pub -m SHA256SUMS
          else
            echo "::warning::packaging/minisign.pub is missing, so the signature was not checked against the shipped key."
          fi
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.name.outputs.prerelease }}
          make_latest: ${{ steps.name.outputs.prerelease == 'false' }}
          files: dist-release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install
            **Linux:** extract `grokhub-linux-v*.tar.gz` and run `./install.sh`,
            or `cargo install --path crates/grokhub-app` from a clone.

            **Windows:** run `GrokHub-Setup-*.exe` (no admin).
            Installs to `%LOCALAPPDATA%\Programs\GrokHub`.

            ## Verify
            `SHA256SUMS` lists every file's SHA-256 and `SHA256SUMS.minisig` signs it.
            `minisign -V -p minisign.pub -m SHA256SUMS`, then `sha256sum -c SHA256SUMS --ignore-missing`.
            The public key is `packaging/minisign.pub` in the repo. GrokHub's updater checks both before it installs.
