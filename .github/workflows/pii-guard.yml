name: pii-guard
on:
  pull_request:
  push:
    branches: [main, beta]
  merge_group:
permissions:
  contents: read
concurrency:
  group: pii-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/beta' }}
jobs:
  pii-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Block personal info
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/pii-guard/pii_guard.py "origin/$BASE_REF"
          else
            python3 scripts/pii-guard/pii_guard.py
          fi
