name: retarget
# Copilot/Jules PRs opened against main are moved to beta. Never checks out PR code.
on:
  pull_request_target:
    types: [opened]
    branches: [main]
permissions: {}
jobs:
  retarget:
    if: contains(fromJSON('["Copilot","copilot-swe-agent[bot]","google-labs-jules[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Switch base to beta and comment once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --base beta
          marker='<!-- retarget-beta -->'
          if ! gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
            gh pr comment "$PR" --body "$marker
          Retargeted to \`beta\` (main is promotion-only). Please merge \`origin/beta\` into this branch normally (no rebase, no force-push) and keep the diff to this card only."
          fi
