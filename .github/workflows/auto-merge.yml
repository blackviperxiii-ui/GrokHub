name: auto-merge
# Squash auto-merge for PRs into beta unless held. Never checks out PR code;
# required status checks still gate the actual merge.
on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, labeled, unlabeled, reopened]
    branches: [beta]
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto-merge:
    if: github.event.pull_request.base.ref == 'beta' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const HOLD = ['needs-windows-shots', 'visual', 'hold'];
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const disable = async (why) => {
              core.info('disable: ' + why);
              if (!pr.auto_merge) return;
              await github.graphql('mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){clientMutationId}}', { id: pr.node_id });
            };
            if (pr.state !== 'open' || pr.base.ref !== 'beta') return core.info('not an open beta PR');
            if (pr.draft) return disable('draft');
            const held = pr.labels.map(l => l.name).filter(n => HOLD.includes(n));
            if (held.length) return disable('hold label: ' + held.join(','));
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number });
            const latest = {};
            for (const r of reviews) {
              const who = r.user?.login || '';
              if (r.state === 'COMMENTED' || r.state === 'PENDING') continue;
              if (who === owner || /copilot/i.test(who)) latest[who] = r.state;
            }
            if (Object.values(latest).includes('CHANGES_REQUESTED')) return disable('changes requested');
            const body = (pr.body || '').split(/\r?\n/)
              .filter(l => !/^\s*(co-authored-by|signed-off-by|reviewed-by|acked-by|tested-by|helped-by|suggested-by|reported-by)\s*:/i.test(l))
              .join('\n').replace(/\n{3,}/g, '\n\n').trim();
            await github.graphql(`mutation($id:ID!,$head:GitObjectID!,$title:String!,$body:String!){
              enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH,expectedHeadOid:$head,commitHeadline:$title,commitBody:$body}){clientMutationId}}`,
              { id: pr.node_id, head: pr.head.sha, title: `${pr.title} (#${number})`, body });
            core.info('squash auto-merge enabled');
