name: Claude Code
on:
  issue_comment: {types: [created]}
  pull_request_review_comment: {types: [created]}
  pull_request_review: {types: [submitted]}
  issues: {types: [opened, labeled]}
jobs:
  claude:
    # Owner only (both the event actor and whoever re-runs it). PR review events
    # must come from a branch in this repo, not a fork; issue events must be on
    # an issue the owner opened. issue_comment on a fork PR is refused in the
    # first step (the comment payload has no head repo).
    if: |
      github.actor == 'blackviperxiii-ui' && github.triggering_actor == 'blackviperxiii-ui' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' && github.event.issue.user.login == 'blackviperxiii-ui' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions: {contents: write, pull-requests: write, issues: write, id-token: write, actions: read}
    steps:
      - name: Refuse comments on fork PRs
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          head_repo=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$REPO" ]; then
            echo "PR #$PR comes from $head_repo, not $REPO: refusing to run Claude on fork code."
            exit 1
          fi
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      # System deps + Rust toolchain: same as the linux job in ci.yml
      # (rustfmt added because claude_args allows cargo fmt).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: beta
          label_trigger: claude
          include_comments_by_actor: "blackviperxiii-ui,claude[bot]"
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(cargo build:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo fmt:*)"
