name: claude
# Disabled: GitHub does not work cards directly. Keep manual dispatch gated off.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Disabled (unused)
        required: false
permissions: {}
concurrency:
  group: claude-${{ inputs.issue_number || github.run_id }}
  cancel-in-progress: false
jobs:
  claude:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beta
          fetch-depth: 0
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: beta
          branch_prefix: claude/
          label_trigger: claude
          trigger_phrase: "@claude"
          allowed_bots: github-actions
          plugin_marketplaces: https://github.com/blackviperxiii-ui/vstack.git
          plugins: vstack@vstack
          prompt: "${{ github.event_name == 'workflow_dispatch' && format('Implement GitHub issue #{0} in {1}. Read it with gh issue view {0}. Follow the repo rules below, then open one PR with gh pr create --base beta whose body says Fixes #{0}.', inputs.issue_number, github.repository) || '' }}"
          claude_args: |
            --allowedTools "Skill,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git:*),Bash(cargo:*),Bash(bash scripts/ci-guards.sh),Bash(python3 scripts/pii-guard/pii_guard.py:*)"
            --append-system-prompt "Load the vstack:viper-mode skill first and follow it; use vstack:follow-through from start to PR, vstack:blast-radius before shared code and vstack:tdd for bugs. Repo rules: base branch beta, never main; branch from origin/beta. One PR per issue. Small, in-card-only diff. Before pushing run cargo fmt --all -- --check, cargo clippy --workspace --all-targets -- -D warnings, cargo nextest run --workspace, bash scripts/ci-guards.sh and python3 scripts/pii-guard/pii_guard.py origin/beta; then push once. Never force-push or rebase; merge origin/beta normally to catch up. No personal info (names, emails, home paths); use user and /home/user. New UI registers through beta's single GROKHUB_DECK_NAV handler, never a separate deck_nav() handler."
