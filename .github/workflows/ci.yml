name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
    # labeled/unlabeled so the Cargo.lock → dependencies escape hatch retriggers
    # when the label is added (guards job reads live labels too).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run it replaces. Pushes to beta and
# main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI profile: no incremental artifacts, line tables instead of full debug
# info (less to link and write, most of all on Windows). The release build
# keeps the real release profile.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

# Tests, lint and the Windows release build run side by side, so the wall
# time is the slowest job, not their sum. `linux` and `windows` keep their
# names (tests); the lint and release jobs are new checks.
# Each job restores its own build cache; caches save only from pushes to beta
# and main, so PRs start warm from their base branch.
jobs:
  # Decides whether the build jobs run. A PR that only touches docs, Markdown,
  # screenshots or research skips them; a skipped job counts as passed for
  # required checks. Pushes to beta and main and manual runs always build.
  # The Electron guard runs here so it covers every change, docs-only ones
  # included.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!screenshots/**'
              - '!research/**'
      - name: No Electron leftover
        run: |
          test ! -f package.json
          test ! -d src
          test ! -d desktop
          test ! -f docs/superpowers/specs/2026-08-14-electron-cabin-bake-design.md
          test ! -f docs/superpowers/specs/2026-08-14-electron-look-design.md
          test ! -f docs/superpowers/plans/2026-08-14-grokhub-2.0-implementation.md
          if git ls-files | grep -E '^(src/|desktop/|package.json$)'; then
            echo "Electron app paths still tracked" >&2
            exit 1
          fi
          if git grep -l 'exec electron' -- . ':!.github/**' ':!.git/**'; then
            echo "electron launch path still present" >&2
            exit 1
          fi
          echo "rust-only tree ok"

  # Fast formatting gate. Runs on every event (no paths-filter skip) so drift
  # cannot land even on docs-only PRs that later touch Rust. Starts with the
  # other jobs; build jobs do not wait on it.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Rearch stages 1–2 friction guards: conflict markers, god-file line
  # budgets, Cargo.lock label hatch, and `cargo xtask bump --check`. Runs on
  # every event (docs-only included) so markers and VERSION drift cannot land.
  # Needs a Rust toolchain because bump --check is an xtask binary; xtask has
  # no crates.io deps so the compile stays small.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: guards-xtask
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
          workspaces: ". -> target"
      - name: Guard fail-closed tests
        run: bash scripts/test-ci-guards.sh
      - name: Repo friction guards
        env:
          # Live label fetch for the Cargo.lock escape hatch (gh / API).
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci-guards.sh

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Each test runs in its own process (see .config/nextest.toml), so they
      # run in parallel. nextest skips doctests; `cargo test --doc` runs them.
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked
      - run: cargo build -p grokhub-app -p grokhub-hub
      - name: Cabin binary exists
        run: test -x target/debug/grokhub && test -x target/debug/grokhub-hub
  linux-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-lint
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      # Carcass: deny dead_code workspace-wide. Retired direct-xAI helpers
      # must be deleted, not allowed.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Supply chain: known advisories (RustSec), licenses, wildcard deps and
  # crate sources, per deny.toml.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # Cross-platform recode, Phase 1 (docs/cross-platform/README.md): the
  # non-UI crates must stay portable to the Tauri targets. Check-only (clippy,
  # no tests, no bundles). macOS and iOS need Apple's toolchain, Android needs
  # the runner's NDK for ring and bundled SQLite. grokhub-proto is the wasm
  # piece the web client will share.
  cross-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            crates: -p grokhub-proto -p grokhub-core -p grokhub-hub -p grokhub-agent
          - target: x86_64-apple-darwin
            os: macos-latest
            crates: -p grokhub-proto -p grokhub-core -p grokhub-hub -p grokhub-agent
          - target: aarch64-apple-ios
            os: macos-latest
            crates: -p grokhub-proto -p grokhub-core -p grokhub-hub -p grokhub-agent
          - target: aarch64-linux-android
            os: ubuntu-latest
            crates: -p grokhub-proto -p grokhub-core -p grokhub-hub -p grokhub-agent
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
            crates: -p grokhub-proto
    name: cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Android NDK compiler
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: cargo clippy --locked ${{ matrix.crates }} --target ${{ matrix.target }} -- -D warnings

  # The Tauri desktop shell (src-tauri/ + ui/, cross-platform Phase 2). It is
  # its own Cargo workspace, so only this job needs the webview libraries.
  # Bundles build on all three OSes; the tauri-driver smoke test (a chat to a
  # mock model) runs where tauri-driver has a backend: Linux and Windows.
  shell:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: shell-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: npm ci --prefix ui
      - run: npm test --prefix ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # clippy and tests compile against ui/dist, so build the UI first.
      - run: npm run build --prefix ui
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Bundles
        shell: bash
        run: ui/node_modules/.bin/tauri build -- --locked
      - name: Smoke-test build
        if: runner.os != 'macOS'
        shell: bash
        run: ui/node_modules/.bin/tauri build --debug --no-bundle -- --locked
      - name: tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node ui/e2e/smoke.mjs src-tauri/target/debug/grokhub-shell
      # msedgedriver must match the WebView2 runtime the shell runs on, which
      # can differ from the runner's Edge, so fetch the driver for that version.
      - name: msedgedriver for WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          "SMOKE_NATIVE_DRIVER=$PWD\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: node ui/e2e/smoke.mjs src-tauri/target/debug/grokhub-shell.exe

  # Phone builds of the shell (cross-platform Phase 4). A smoke build carries
  # the mock model's loopback URL and drives one chat itself
  # (ui/src/phoneSmoke.ts); ui/e2e/phone.mjs serves the mock, installs the app
  # on an emulator or simulator and reads the app's report back.
  phone-android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: phone (android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_PHONE_SMOKE: "1"
      GROKHUB_PHONE_SMOKE_URL: http://127.0.0.1:4610/v1/responses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: phone-android
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - run: npm ci --prefix ui
      - name: Smoke build
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ui/node_modules/.bin/tauri android init --ci
          ui/node_modules/.bin/tauri android build --ci --debug --apk --target x86_64 --features phone-smoke
          apk=$(find src-tauri/gen/android -name '*.apk' -path '*debug*' | head -1)
          test -n "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: node ui/e2e/phone.mjs android "$APK"

  phone-ios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: phone (ios)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VITE_PHONE_SMOKE: "1"
      GROKHUB_PHONE_SMOKE_URL: http://127.0.0.1:4610/v1/responses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: phone-ios
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - run: npm ci --prefix ui
      - name: Smoke build
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ui/node_modules/.bin/tauri ios init --ci
          ui/node_modules/.bin/tauri ios build --ci --debug --target aarch64-sim --features phone-smoke
          app=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode/DerivedData" -name '*.app' -type d -path '*simulator*' 2>/dev/null | head -1)
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Smoke test
        run: node ui/e2e/phone.mjs ios "$APP"

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked

  windows-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-lint
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      # Carcass: deny dead_code workspace-wide. Retired direct-xAI helpers
      # must be deleted, not allowed.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  windows-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo build --release --locked -p grokhub-app -p grokhub-hub
      - name: Cabin binaries exist
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/grokhub.exe)) { throw 'missing grokhub.exe' }
          if (-not (Test-Path target/release/grokhub-hub.exe)) { throw 'missing grokhub-hub.exe' }
      - name: Pack script locks
        shell: pwsh
        run: ./scripts/make-windows-release.tests.ps1
      - name: No Electron leftover
        shell: pwsh
        run: |
          if (Test-Path package.json) { throw 'electron leftover' }
          if (Test-Path desktop) { throw 'electron leftover' }
