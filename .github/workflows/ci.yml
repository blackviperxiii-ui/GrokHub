name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run it replaces. Pushes to beta and
# main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI profile: no incremental artifacts, line tables instead of full debug
# info (less to link and write, most of all on Windows). The release build
# keeps the real release profile.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

# Tests, lint and the Windows release build run side by side, so the wall
# time is the slowest job, not their sum. `linux` and `windows` keep their
# names (tests); the lint and release jobs are new checks.
# Each job restores its own build cache; caches save only from pushes to beta
# and main, so PRs start warm from their base branch.
jobs:
  # Decides whether the build jobs run. A PR that only touches docs, Markdown,
  # screenshots or research skips them; a skipped job counts as passed for
  # required checks. Pushes to beta and main and manual runs always build.
  # The Electron guard runs here so it covers every change, docs-only ones
  # included.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!screenshots/**'
              - '!research/**'
      - name: No Electron leftover
        run: |
          test ! -f package.json
          test ! -d src
          test ! -d desktop
          test ! -f docs/superpowers/specs/2026-08-14-electron-cabin-bake-design.md
          test ! -f docs/superpowers/specs/2026-08-14-electron-look-design.md
          test ! -f docs/superpowers/plans/2026-08-14-grokhub-2.0-implementation.md
          if git ls-files | grep -E '^(src/|desktop/|package.json$)'; then
            echo "Electron app paths still tracked" >&2
            exit 1
          fi
          if git grep -l 'exec electron' -- . ':!.github/**' ':!.git/**'; then
            echo "electron launch path still present" >&2
            exit 1
          fi
          echo "rust-only tree ok"


  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Each test runs in its own process (see .config/nextest.toml), so they
      # run in parallel. nextest skips doctests; `cargo test --doc` runs them.
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked
      - run: cargo build -p grokhub-app -p grokhub-hub
      - name: Cabin binary exists
        run: test -x target/debug/grokhub && test -x target/debug/grokhub-hub
  linux-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-lint
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      # Carcass: deny dead_code workspace-wide. Retired direct-xAI helpers
      # must be deleted, not allowed.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked

  windows-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-lint
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      # Carcass: deny dead_code workspace-wide. Retired direct-xAI helpers
      # must be deleted, not allowed.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  windows-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo build --release --locked -p grokhub-app -p grokhub-hub
      - name: Cabin binaries exist
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/grokhub.exe)) { throw 'missing grokhub.exe' }
          if (-not (Test-Path target/release/grokhub-hub.exe)) { throw 'missing grokhub-hub.exe' }
      - name: Pack script locks
        shell: pwsh
        run: ./scripts/make-windows-release.tests.ps1
      - name: No Electron leftover
        shell: pwsh
        run: |
          if (Test-Path package.json) { throw 'electron leftover' }
          if (Test-Path desktop) { throw 'electron leftover' }
