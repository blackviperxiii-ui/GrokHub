name: CI

on:
  # Push to beta runs only the light gate (changes, fmt, guards, linux,
  # windows; pii-guard lives in pii-guard.yml). Heavy jobs run on push to main,
  # v* tags, the nightly schedule (which checks out beta) and manual runs.
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
    branches: [main, beta]
    # labeled/unlabeled so the Cargo.lock → dependencies escape hatch retriggers
    # when the label is added (guards job reads live labels too).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
  merge_group:
  # Nightly full run on beta (~3 AM America/Chicago): everything PRs and beta
  # pushes skip (cross-check, shell, phones, windows-release, deny). Schedules
  # fire from the default branch (main), so every checkout below uses
  # SOURCE_REF to build beta instead.
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

# A newer push to the same PR, or a newer push to beta (light gate only),
# cancels the run it replaces. Main, tags, nightly and manual runs finish.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly-beta' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/beta') }}

# CI profile: no incremental artifacts, line tables instead of full debug
# info (less to link and write, most of all on Windows). The release build
# keeps the real release profile.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  # Nightly builds beta; every other event checks out its own ref.
  SOURCE_REF: ${{ github.event_name == 'schedule' && 'beta' || '' }}

# PRs run the fast gate: fmt, guards, changes, linux (clippy + tests in one
# build) and windows (same), plus path-filtered shell and phone-android. The
# slow jobs (cross-check, macOS shell, phone-ios, windows-release, and deny
# unless Cargo.lock or deny.toml changed) run on push to main, v* tags,
# nightly (on beta) and on manual runs. Push to beta runs only the gate. Every gate is a job-level `if:`, never a workflow-level
# path filter, so a skipped job still reports and required checks never hang.
# Each job restores its own build cache; caches save only from pushes to beta
# and main, so PRs start warm from their base branch.
jobs:
  # Decides whether the build jobs run. A PR that only touches docs, Markdown,
  # screenshots or research skips them; a skipped job counts as passed for
  # required checks. Pushes to beta and main and manual runs always build.
  # The Electron guard runs here so it covers every change, docs-only ones
  # included.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # pull_request and push use paths-filter. merge_group has no filter base,
    # so it counts as code=true; schedule and workflow_dispatch run everything.
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      # Heavy outputs are false on push to beta; nightly covers beta instead.
      deny: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && steps.paths.outputs.deny == 'true') }}
      cross: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) || ((github.event_name == 'push' && github.ref == 'refs/heads/main') && steps.paths.outputs.cross == 'true') }}
      phone_android: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) || github.event_name == 'merge_group' || ((github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.paths.outputs.phone == 'true') }}
      phone_ios: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) || ((github.event_name == 'push' && github.ref == 'refs/heads/main') && steps.paths.outputs.phone == 'true') }}
      release: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      shell_os: ${{ steps.shell.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!screenshots/**'
              - '!research/**'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          filters: |
            deny:
              - 'Cargo.lock'
              - 'deny.toml'
            cross:
              - 'crates/grokhub-proto/**'
              - 'crates/grokhub-core/**'
              - 'crates/grokhub-hub/**'
              - 'crates/grokhub-agent/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            phone:
              - 'ui/**'
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
            shell:
              - 'ui/**'
              - 'src-tauri/**'
              - 'crates/grokhub-core/**'
              - 'crates/grokhub-agent/**'
              - 'crates/grokhub-desktop/**'
              - 'crates/grokhub-proto/**'
              - '.github/workflows/ci.yml'
      # Shell matrix: PRs run ubuntu + windows only when shell/UI paths change;
      # merge_group runs ubuntu + windows; push to beta runs none (nightly covers
      # it); push to main, tags, nightly and manual add macOS.
      - name: Shell matrix
        id: shell
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHELL_PATHS: ${{ steps.paths.outputs.shell }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            if [ "$SHELL_PATHS" = true ]; then os='["ubuntu-latest","windows-latest"]'; else os='[]'; fi
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/beta ]; then
            os='[]'
          elif [ "$EVENT" = merge_group ]; then
            os='["ubuntu-latest","windows-latest"]'
          else
            os='["ubuntu-latest","windows-latest","macos-latest"]'
          fi
          echo "os=$os" >> "$GITHUB_OUTPUT"
      - name: No Electron leftover
        run: |
          test ! -f package.json
          test ! -d src
          test ! -d desktop
          test ! -f docs/superpowers/specs/2026-08-14-electron-cabin-bake-design.md
          test ! -f docs/superpowers/specs/2026-08-14-electron-look-design.md
          test ! -f docs/superpowers/plans/2026-08-14-grokhub-2.0-implementation.md
          if git ls-files | grep -E '^(src/|desktop/|package.json$)'; then
            echo "Electron app paths still tracked" >&2
            exit 1
          fi
          if git grep -l 'exec electron' -- . ':!.github/**' ':!.git/**'; then
            echo "electron launch path still present" >&2
            exit 1
          fi
          echo "rust-only tree ok"

  # Fast formatting gate. Runs on every event (no paths-filter skip) so drift
  # cannot land even on docs-only PRs that later touch Rust. Starts with the
  # other jobs; build jobs do not wait on it.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Rearch stages 1–2 friction guards: conflict markers, god-file line
  # budgets, Cargo.lock label hatch, and `cargo xtask bump --check`. Runs on
  # every event (docs-only included) so markers and VERSION drift cannot land.
  # Needs a Rust toolchain because bump --check is an xtask binary; xtask has
  # no crates.io deps so the compile stays small.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: guards-xtask
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
          workspaces: ". -> target"
      - name: Guard fail-closed tests
        run: bash scripts/test-ci-guards.sh
      - name: Repo friction guards
        env:
          # Live label fetch for the Cargo.lock escape hatch (gh / API).
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci-guards.sh

  # Clippy and tests in one job so they share one build and one cache.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-test
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - name: Native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libwayland-dev libasound2-dev
      # Carcass: deny dead_code workspace-wide. Retired direct-xAI helpers
      # must be deleted, not allowed.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: nextest
      # Each test runs in its own process (see .config/nextest.toml), so they
      # run in parallel. nextest skips doctests; `cargo test --doc` runs them.
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked
      - run: cargo build -p grokhub-app -p grokhub-hub
      - name: Cabin binary exists
        run: test -x target/debug/grokhub && test -x target/debug/grokhub-hub
  # Supply chain: known advisories (RustSec), licenses, wildcard deps and
  # crate sources, per deny.toml.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # Cross-platform recode, Phase 1 (docs/cross-platform/README.md): the
  # non-UI crates must stay portable to the Tauri targets. Check-only (clippy,
  # no tests, no bundles). macOS and iOS need Apple's toolchain, Android needs
  # the runner's NDK for ring and bundled SQLite. grokhub-proto is the wasm
  # piece the web client will share.
  cross-check:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.cross == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            crates: -p grokhub-proto -p grokhub-core -p grokhub-hub -p grokhub-agent
          - target: x86_64-apple-darwin
            os: macos-latest
            crates: -p grokhub-proto -p grokhub-core -p grokhub-hub -p grokhub-agent
          - target: aarch64-apple-ios
            os: macos-latest
            crates: -p grokhub-proto -p grokhub-core -p grokhub-hub -p grokhub-agent
          - target: aarch64-linux-android
            os: ubuntu-latest
            crates: -p grokhub-proto -p grokhub-core -p grokhub-hub -p grokhub-agent
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
            crates: -p grokhub-proto
    name: cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: cross-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - name: Android NDK compiler
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: cargo clippy --locked ${{ matrix.crates }} --target ${{ matrix.target }} -- -D warnings

  # The Tauri desktop shell (src-tauri/ + ui/, cross-platform Phase 2). It is
  # its own Cargo workspace, so only this job needs the webview libraries.
  # Bundles build on all three OSes; the tauri-driver smoke test (a chat to a
  # mock model) runs where tauri-driver has a backend: Linux and Windows.
  # The web app smoke test (Phase 5) runs on Linux.
  shell:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.shell_os != '[]' && needs.changes.outputs.shell_os != ''
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.shell_os) }}
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: shell-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: npm ci --prefix ui
      - run: npm run lint --prefix ui
      - run: npm test --prefix ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # clippy and tests compile against ui/dist, so build the UI first.
      - run: npm run build --prefix ui
      # The web app (Phase 5) in Chromium against a mocked desktop: pair,
      # chat with one tool approval, and no pairing code in browser storage.
      - name: Web smoke test
        if: runner.os == 'Linux'
        run: |
          ui/node_modules/.bin/playwright install --with-deps chromium
          node ui/e2e/web.mjs
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Bundles
        shell: bash
        run: ui/node_modules/.bin/tauri build -- --locked
      - name: Smoke-test build
        if: runner.os != 'macOS'
        shell: bash
        run: ui/node_modules/.bin/tauri build --debug --no-bundle -- --locked
      - name: tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      # SMOKE_WEB adds the web access step (Chromium from the web smoke test).
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          SMOKE_WEB: "1"
          SMOKE_SHOTS: smoke-shots
        run: xvfb-run -a -s "-screen 0 1280x900x24" node ui/e2e/smoke.mjs src-tauri/target/debug/grokhub-shell
      # msedgedriver must match the WebView2 runtime the shell runs on, which
      # can differ from the runner's Edge, so fetch the driver for that version.
      - name: msedgedriver for WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          "SMOKE_NATIVE_DRIVER=$PWD\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          SMOKE_SHOTS: smoke-shots
        run: node ui/e2e/smoke.mjs src-tauri/target/debug/grokhub-shell.exe
      # One screenshot per walked screen, for the parity walk.
      - name: Smoke screenshots
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots-${{ runner.os }}
          path: smoke-shots/
          if-no-files-found: ignore
          retention-days: 14

  # Phone builds of the shell (cross-platform Phase 4). A smoke build carries
  # the mock model's loopback URL and drives one chat itself
  # (ui/src/phoneSmoke.ts); ui/e2e/phone.mjs serves the mock, installs the app
  # on an emulator or simulator and reads the app's report back.
  phone-android:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.phone_android == 'true'
    name: phone (android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_PHONE_SMOKE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: phone-android
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - run: npm ci --prefix ui
      # The Gradle and Xcode projects call the CLI back while they build. The
      # npm CLI records a path relative to where it ran, which they can't
      # find, so the phone jobs use cargo's.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: tauri-cli@2.12.4
      - name: Smoke build
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android init --ci
          cargo tauri android build --ci --debug --apk --target x86_64 --features phone-smoke
          apk=$(find src-tauri/gen/android -name '*.apk' -path '*debug*' | head -1)
          test -n "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: node ui/e2e/phone.mjs android "$APK"

  phone-ios:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.phone_ios == 'true'
    name: phone (ios)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VITE_PHONE_SMOKE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: phone-ios
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - run: npm ci --prefix ui
      # Built here rather than fetched: the prebuilt macOS binary is x86_64,
      # and under Rosetta it can't brew-install what `ios init` needs.
      - name: cargo tauri
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Smoke build
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list libimobiledevice >/dev/null 2>&1 || brew install libimobiledevice
          cargo tauri ios init --ci
          cargo tauri ios build --ci --debug --target aarch64-sim --features phone-smoke
          app=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode/DerivedData" -name '*.app' -type d -path '*simulator*' 2>/dev/null | head -1)
          test -n "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Smoke test
        run: node ui/e2e/phone.mjs ios "$APP"

  # Clippy and tests in one job so they share one build and one cache.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-test
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      # Carcass: deny dead_code workspace-wide. Retired direct-xAI helpers
      # must be deleted, not allowed.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked

  windows-release:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-release
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - run: cargo build --release --locked -p grokhub-app -p grokhub-hub
      - name: Cabin binaries exist
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/grokhub.exe)) { throw 'missing grokhub.exe' }
          if (-not (Test-Path target/release/grokhub-hub.exe)) { throw 'missing grokhub-hub.exe' }
      # Deck-match evidence: grokhub.exe beside deck slides 02 and 20 (chrome)
      # plus settings/upgrade captures from the widget recipe work. Evidence
      # only, so it never fails the check.
      - name: Deck shots
        continue-on-error: true
        shell: pwsh
        run: ./scripts/deck-shots.ps1 -Slide 02
      - name: Upload deck shots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deck-shots
          path: target/deck-shots/
          if-no-files-found: ignore
          retention-days: 14
      # Free web_search proof: live DDG Lite cites in OpenRouter + local chats
      # at HARD DONE sizes. Evidence only — never fails the check.
      - name: Web search shots
        continue-on-error: true
        shell: pwsh
        run: ./scripts/web-search-shots.ps1
      - name: Upload web search shots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-search-shots
          path: target/web-search-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Pack script locks
        shell: pwsh
        run: ./scripts/make-windows-release.tests.ps1
      - name: No Electron leftover
        shell: pwsh
        run: |
          if (Test-Path package.json) { throw 'electron leftover' }
          if (Test-Path desktop) { throw 'electron leftover' }
