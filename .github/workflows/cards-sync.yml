name: cards-sync
# Mark linked Notion Command Center cards Completed when PRs merge to beta or card issues close.
# Needs secret NOTION_TOKEN; no-ops without the token.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  issues:
    types: [closed]
  pull_request:
    types: [closed]
    branches: [beta]
permissions: {}
concurrency:
  group: cards-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beta
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Sweep merged/closed card issues to Completed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cards_sync.py sync
  done:
    # An issue counts only when the sync opened it or one of the project's own
    # people did (cards_sync.py checks the same), so an outsider's issue never
    # starts the job that holds the board token.
    if: >-
      (github.event_name == 'issues' && github.event.issue.state_reason == 'completed' &&
       (github.event.issue.user.login == 'github-actions[bot]' ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beta
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Mark linked card Done
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cards_sync.py done
