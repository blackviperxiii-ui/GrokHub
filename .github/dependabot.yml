# Workflow actions are pinned to commit SHAs (scripts/ci-guards.sh check 7).
# Dependabot opens PRs that move the pins and their tag comments together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: beta
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
  # Dependency drift arrives as at most one grouped PR a month per manifest,
  # into beta. Security updates target main and fail, so these replace them.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    target-branch: beta
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      cargo-root:
        patterns:
          - "*"
    # ashpd 0.14 (and xcap 0.9.10, which pulls it in) move to zbus 6, while
    # tauri-plugin-notification and the keyring store still need zbus 5, so
    # taking them builds two zbus majors and breaks grokhub-desktop. Lift
    # these together with the zbus 6 move.
    ignore:
      - dependency-name: ashpd
        versions: [">=0.14"]
      - dependency-name: xcap
        versions: [">=0.9.10"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    target-branch: beta
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      cargo-tauri:
        patterns:
          - "*"
    # ashpd 0.14 (and xcap 0.9.10, which pulls it in) move to zbus 6, while
    # tauri-plugin-notification and the keyring store still need zbus 5, so
    # taking them builds two zbus majors and breaks grokhub-desktop. Lift
    # these together with the zbus 6 move.
    ignore:
      - dependency-name: ashpd
        versions: [">=0.14"]
      - dependency-name: xcap
        versions: [">=0.9.10"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    target-branch: beta
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      npm-ui:
        patterns:
          - "*"
