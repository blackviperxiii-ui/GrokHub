[workspace]
resolver = "2"
members = [
    "crates/grokhub-core",
    "crates/grokhub-hub",
    "crates/grokhub-app",
    "crates/grokhub-ffi",
]

[workspace.package]
version = "2.6.30"
edition = "2021"
license = "MIT"
repository = "https://github.com/blackviperxiii-ui/Grok-Hub"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"
