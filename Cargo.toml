[workspace]
resolver = "2"
members = [
    "crates/grokhub-core",
    "crates/grokhub-hub",
    "crates/grokhub-app",
    "crates/grokhub-agent",
]

[workspace.package]
version = "2.13.1"
rust-version = "1.95"
edition = "2021"
license = "MIT"
repository = "https://github.com/blackviperxiii-ui/GrokHub.git"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"

# Smaller, faster release binaries. Thin LTO + one codegen unit; strip symbols
# (keep the binary runnable; crash UI cards do not need DWARF). Panic stays unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Quicker local/CI debug links. Matches CI's CARGO_PROFILE_DEV_DEBUG.
[profile.dev]
debug = "line-tables-only"
