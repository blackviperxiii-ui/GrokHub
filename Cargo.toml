[workspace]
resolver = "2"
members = [
    "crates/grokhub-proto",
    "crates/grokhub-core",
    "crates/grokhub-hub",
    "crates/grokhub-app",
    "crates/grokhub-agent",
    "crates/grokhub-desktop",
    "xtask",
]

[workspace.package]
version = "3.5.0"
rust-version = "1.95"
edition = "2024"
license = "MIT"
repository = "https://github.com/blackviperxiii-ui/GrokHub.git"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"
sha2 = "0.10"
# The one HTTP client, behind `grokhub_core::http` (LU-12). `~3.5`: the facade
# implements ureq's resolver and connector traits, which ureq exempts from semver.
# `rustls` = rustls with the ring provider and webpki roots (no aws-lc-rs).
ureq = { version = "~3.5", default-features = false, features = ["rustls"] }
# Shared codecs; app adds webp/ico/bmp on top via its own features line.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# keyring 4 requires the `v1` (or `cli`) feature; `v1` enables each OS store and
# the crates themselves are target-gated, so Linux still only compiles Secret Service.
keyring = { version = "4", default-features = false, features = ["v1"] }
rusqlite = { version = "0.41", features = ["bundled"] }

# Edition 2024 turns clippy's collapsible_if on for nested `if let`s (it asks
# for let chains). Rewriting the existing ones is out of LU-09's scope; core,
# agent and app opt in here so new code may use let chains and old code stays
# as written. Drop this with a deliberate let-chain sweep.
[workspace.lints.clippy]
collapsible_if = "allow"

# Smaller, faster release binaries. Thin LTO + one codegen unit; strip symbols
# (keep the binary runnable; crash UI cards do not need DWARF). Panic stays unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Quicker local/CI debug links. Matches CI's CARGO_PROFILE_DEV_DEBUG.
[profile.dev]
debug = "line-tables-only"
