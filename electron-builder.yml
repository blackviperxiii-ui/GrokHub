appId: com.grokhub.app
productName: GrokHub
copyright: Copyright © GrokHub contributors
directories:
  output: dist
  buildResources: packaging/windows/build
files:
  - desktop/**/*
  - .output/**/*
  - package.json
  - APP_VERSION
  - LICENSE
  - "!desktop/**/*.{map,ts}"
  - "!**/{.git,src,vendor,screenshots,artifacts,node_modules}/**"
extraMetadata:
  main: desktop/main.mjs
  # packaged app is CommonJS-loaded by Electron from main field
asar: false
electronVersion: 35.1.2

win:
  icon: packaging/windows/build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
  executableName: GrokHub
  publisherName: GrokHub
  signAndEditExecutable: false

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GrokHub
  uninstallDisplayName: GrokHub
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

linux:
  icon: packaging/icons
  category: Utility
  target:
    - AppImage
  executableName: grokhub
  desktop:
    Name: GrokHub
    StartupWMClass: grokhub
