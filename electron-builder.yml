appId: com.grokhub.app
productName: GrokHub
copyright: Copyright © GrokHub contributors
directories:
  output: dist
  buildResources: packaging/windows
files:
  - desktop/**/*
  - .output/**/*
  - package.json
  - APP_VERSION
  - packaging/windows/grokhub.cmd
  - packaging/windows/grokhub.ps1
  - "!**/{node_modules,.git,src,vendor,screenshots,artifacts}/**"
extraMetadata:
  main: desktop/main.mjs
asar: false
electronVersion: 35.1.2

win:
  icon: desktop/icons/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  executableName: GrokHub
  # Match AppUserModelId used in desktop/main.mjs
  publisherName: GrokHub

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GrokHub
  uninstallDisplayName: GrokHub
  license: LICENSE
  runAfterFinish: true
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  icon: packaging/icons
  category: Utility
  target:
    - AppImage
  executableName: grokhub
  desktop:
    Name: GrokHub
    StartupWMClass: grokhub

# Custom entry: start nitro UI then electron — use our launcher when possible
# electron-builder uses desktop/main.mjs as main; UI server is started by
# packaging/windows/grokhub.cmd for portable/source installs. NSIS builds
# set GROKHUB_HOME to install dir; main.mjs can start embedded UI if present.
