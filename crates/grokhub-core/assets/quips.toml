# Quip bank: style examples the voice riffs on, never lines to paste.
#
# heat: clean (adults-only off, roast voices only), cheeky, spicy, filthy.
# trigger: fail, win, death, grind, idle, late_night, self_own, roast_back, greeting.
# mechanism: simile, hyperbole, misdirect, understatement, callback, absurd.
#
# Rules every line keeps (tests check them): playful, never mean; the joke is on
# the moment, the game, the code or the voice itself, never on who the user is.
# Never about minors, real people or non-consent, no slurs. Clean and cheeky
# lines carry no sexual words at all.

