# GrokHub playbook: repair a Windows computer.
#
# Copy this file to `playbooks/` in the settings folder (Settings → Playbooks →
# Duplicate does it for you) to change it. A file there with the same id
# replaces the shipped one; Reset puts the shipped one back.
#
# Look steps name repair probes: fixed, read-only checks with no shell. Safe
# steps can be undone. Risky steps ask you first, every time.

id = "repair-windows"
name = "Repair Windows"
summary = "Check disks, stopped services, recent errors, the network and updates first; start services before repairing system files."

checklist = ["services", "updates", "recent errors", "disk space", "network"]
backup = "Take a System Restore point first and copy each file to a .bak before editing it."
verify = "Run the same probe again after each fix and compare: the service is running, the error is gone, the network test passes."
rollback = "Put the .bak copies back; for a system change, go back to the restore point taken first."
give_up = [
  "a hard approval was refused",
  "hardware, access or a sign-in is missing",
  "every approach in the playbook failed and was checked",
]

[applies_when]
intent = ["repair"]
domain = ["system"]
os = ["windows"]

[[phase]]
name = "Look"
tier = "read_only"

[[phase.step]]
name = "List services set to start that aren't running"
probe = "services_stopped_auto"

[[phase.step]]
name = "Read the last day's system errors"
probe = "event_errors_24h"

[[phase.step]]
name = "Check disk space"
probe = "volumes"

[[phase.step]]
name = "Test the internet connection and name lookups"
probe = "net_test"

[[phase.step]]
name = "List app updates"
probe = "winget_upgrades"

[[phase.step]]
name = "Check Windows Update and pending restarts"
probe = "wu_pending"

[[phase]]
name = "Back up"
tier = "safe"

[[phase.step]]
name = "Take a System Restore point before the first change"

[[phase]]
name = "Fix"
tier = "safe"

[[phase.step]]
name = "Start a stopped service"
run = "Start-Service -Name Spooler"

[[phase.step]]
name = "Clear cached website addresses"
run = "ipconfig /flushdns"

[[phase.step]]
name = "Re-check with the same probe"

[[phase]]
name = "Bigger fixes"
tier = "risky"

[[phase.step]]
name = "Repair system files"
run = "sfc /scannow"

[[phase.step]]
name = "Repair the Windows image"
run = "DISM /Online /Cleanup-Image /RestoreHealth"

[[phase.step]]
name = "Install app updates"
run = "winget upgrade --all"

[[phase.step]]
name = "Delete temporary files to free space"
run = "Remove-Item -Path $env:TEMP\\* -Recurse -Force"
