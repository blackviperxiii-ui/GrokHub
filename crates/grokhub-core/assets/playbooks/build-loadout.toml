# GrokHub playbook: PC parts and in-game loadout advice with dated prices.
#
# Copy this file to `playbooks/` in the settings folder (Settings → Playbooks →
# Duplicate does it for you) to change it. A file there with the same id
# replaces the shipped one; Reset puts the shipped one back.
#
# Look steps only read. Safe steps can be undone. Risky steps ask you first,
# every time; a playbook can never make GrokHub skip an approval.

id = "build-loadout"
name = "Build and loadout"
summary = "Compare two or three PC parts or in-game loadout options with dated prices. Recommend one; a buy step still asks first."

checklist = [
  "goal and budget clear",
  "two or three options compared",
  "prices dated",
  "one pick recommended",
]
backup = "Nothing is bought until approval: keep the compared options and price dates in the reply so they can be revised."
verify = "The reply compares two or three options, dates each price, and names one pick; no purchase was placed on its own."
rollback = "If a wrong price or option was shown, correct it in one short follow-up and stop."
give_up = [
  "a hard approval was refused",
  "hardware, access or a sign-in is missing",
  "every approach in the playbook failed and was checked",
]

[applies_when]
intent = ["task", "question", "research"]
domain = ["loadout"]

[[phase]]
name = "Look"
tier = "read_only"

[[phase.step]]
name = "Clarify the goal (PC parts or in-game loadout), budget, platform and any must-have parts or gear"

[[phase.step]]
name = "Read this PC's current parts when the ask is a PC upgrade, so advice fits what is already here"

[[phase]]
name = "Compare"
tier = "safe"

[[phase.step]]
name = "Compare two or three options with a short line each: fit, trade-offs and a price with its date"

[[phase.step]]
name = "Recommend one pick and say why; do not place an order or buy anything"

[[phase]]
name = "Buy"
tier = "risky"

[[phase.step]]
name = "Open a buy link or place an order only after approval — never purchase on your own"
