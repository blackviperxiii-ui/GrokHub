# Loadout playbook: check up and tune up a computer that isn't broken. For
# "check this PC", "it's slow", "free up storage". One family for Linux,
# Windows and macOS; the turn's prompt keeps only this computer's steps.
#
# Copy this file to `playbooks/` in the settings folder (Settings → Playbooks →
# Duplicate does it for you) to change it. A file there with the same id
# replaces the shipped one; Reset puts the shipped one back.
#
# The look steps are fixed, read-only repair probes. Nothing changes until the
# user picks a suggestion, and risky steps ask first, every time.

id = "pc-tuneup"
name = "Check up this PC"
summary = "Run the read-only checks first, explain what they found in plain words, rank the fixes by how much they help, and change nothing until the user picks one."

checklist = ["disk space", "memory", "startup and services", "recent errors", "updates", "network"]
backup = "Take a restore point before the first change (snapper or Timeshift on Linux, System Restore on Windows, a Time Machine backup on macOS)."
verify = "Run the same check again after each change and compare it with the first reading. Say what got better in numbers, like space freed or errors gone."
rollback = "Go back to the restore point taken first, and restart what was restarted."
give_up = [
  "the user said no to the suggestions",
  "a check needs admin rights the user won't give",
  "the trouble is hardware, like a failing drive or overheating parts",
]

[applies_when]
intent = ["repair", "task", "question"]
domain = ["pc-health"]
os = ["linux", "windows", "macos"]

[[phase]]
name = "Look"
tier = "read_only"

[[phase.step]]
name = "Run every check below before saying anything about the PC; never answer a check-up from general advice"

[[phase.step]]
name = "Check disk space"
probe = "disk_usage"
os = ["linux"]

[[phase.step]]
name = "Check memory"
probe = "memory"
os = ["linux"]

[[phase.step]]
name = "List failed services"
probe = "failed_services"
os = ["linux"]

[[phase.step]]
name = "Read this boot's errors"
probe = "boot_errors"
os = ["linux"]

[[phase.step]]
name = "List pending updates from the lists already on disk"
probe = "pending_updates"
os = ["linux"]

[[phase.step]]
name = "Check name lookups (DNS)"
probe = "dns"
os = ["linux"]

[[phase.step]]
name = "Check disk space"
probe = "volumes"
os = ["windows"]

[[phase.step]]
name = "List services set to start that aren't running"
probe = "services_stopped_auto"
os = ["windows"]

[[phase.step]]
name = "Read the last day's system errors"
probe = "event_errors_24h"
os = ["windows"]

[[phase.step]]
name = "List app updates"
probe = "winget_upgrades"
os = ["windows"]

[[phase.step]]
name = "Check Windows Update and pending restarts"
probe = "wu_pending"
os = ["windows"]

[[phase.step]]
name = "Test the internet connection and name lookups"
probe = "net_test"
os = ["windows"]

[[phase.step]]
name = "Check disk space (df -h)"
os = ["macos"]

[[phase.step]]
name = "Check memory pressure (memory_pressure)"
os = ["macos"]

[[phase.step]]
name = "List macOS updates (softwareupdate --list)"
os = ["macos"]

[[phase]]
name = "Suggest"
tier = "read_only"

[[phase.step]]
name = "Say what the checks found in two or three plain lines: what's healthy, what isn't, with the numbers"

[[phase.step]]
name = "Rank the fixes by how much each helps, biggest first, and say for each one what it changes and whether it can be undone"

[[phase.step]]
name = "Leave games, their files and anti-cheat software alone: never suggest closing, removing or changing them"

[[phase.step]]
name = "Ask which fixes to make before making any"

[[phase]]
name = "Back up"
tier = "safe"

[[phase.step]]
name = "Take a restore point before the first change"

[[phase]]
name = "Tune"
tier = "safe"

[[phase.step]]
name = "Clear cached website addresses"
run = "ipconfig /flushdns"
os = ["windows"]

[[phase.step]]
name = "Re-check with the same probe and say what changed"

[[phase]]
name = "Bigger fixes"
tier = "risky"

[[phase.step]]
name = "Clear the thumbnail cache"
run = "rm -rf ~/.cache/thumbnails/*"
os = ["linux"]

[[phase.step]]
name = "Trim old journal logs to the last two weeks"
run = "sudo journalctl --vacuum-time=2weeks"
os = ["linux"]

[[phase.step]]
name = "On Arch: delete old installer copies to free space"
run = "sudo paccache -rk1"
os = ["linux"]

[[phase.step]]
name = "On Debian or Ubuntu: delete old installer copies to free space"
run = "sudo apt-get autoclean"
os = ["linux"]

[[phase.step]]
name = "On Fedora: delete old installer copies to free space"
run = "sudo dnf clean packages"
os = ["linux"]

[[phase.step]]
name = "Install pending updates"
os = ["linux", "macos"]

[[phase.step]]
name = "Delete temporary files to free space"
run = "Remove-Item -Path $env:TEMP\\* -Recurse -Force"
os = ["windows"]

[[phase.step]]
name = "Install app updates"
run = "winget upgrade --all"
os = ["windows"]

[[phase.step]]
name = "Turn off a startup app the user named"
os = ["windows", "macos", "linux"]
