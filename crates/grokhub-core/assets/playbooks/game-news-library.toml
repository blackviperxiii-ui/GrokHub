# GrokHub playbook: Steam library, sales and patch notes — read-only by default.
#
# Copy this file to `playbooks/` in the settings folder (Settings → Playbooks →
# Duplicate does it for you) to change it. A file there with the same id
# replaces the shipped one; Reset puts the shipped one back.
#
# Look steps only read. Safe steps can be undone. Risky steps ask you first,
# every time; a playbook can never make GrokHub skip an approval.

id = "game-news-library"
name = "Game news and library"
summary = "Read the Steam library, sales and patch notes. Stay read-only; a buy or spend step still asks first."

checklist = [
  "library or store source named",
  "dates on sales and patch notes",
  "no purchase on its own",
]
backup = "Nothing is bought: keep the sale price, patch date and library fact in the reply so they can be checked again."
verify = "Every sale or patch note has a date; the reply did not buy, redeem or spend anything on its own."
rollback = "If a sale or patch fact was wrong, correct it in one short follow-up and stop."
give_up = [
  "a hard approval was refused",
  "hardware, access or a sign-in is missing",
  "every approach in the playbook failed and was checked",
]

[applies_when]
intent = ["question", "research", "task"]
domain = ["library"]

[[phase]]
name = "Look"
tier = "read_only"

[[phase.step]]
name = "Read the Steam library, store page, sale list or patch notes the ask names — look only"

[[phase.step]]
name = "Note the date on each sale price and patch note; drop stale ones"

[[phase]]
name = "Answer"
tier = "safe"

[[phase.step]]
name = "Summarize what is owned, on sale or new in the patch, with dates; do not buy or spend"

[[phase]]
name = "Buy"
tier = "risky"

[[phase.step]]
name = "Buy, redeem, gift or spend store credit only after approval — never purchase on your own"
