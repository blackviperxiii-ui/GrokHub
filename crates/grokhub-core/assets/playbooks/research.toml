# GrokHub playbook: find something out from several sources.
#
# Copy this file to `playbooks/` in the settings folder (Settings → Playbooks →
# Duplicate does it for you) to change it. A file there with the same id
# replaces the shipped one; Reset puts the shipped one back.
#
# Look steps only read. Safe steps can be undone. Risky steps ask you first,
# every time; a playbook can never make GrokHub skip an approval.

id = "research"
name = "Research"
summary = "Gather sources until enough agree, prefer the original, note dates, cite claims, and stop once the bar is met."

checklist = ["enough sources", "sources named", "answer summarized", "claims cited"]
backup = "Nothing is changed: research only reads. Keep the link and date of each source used."
verify = "Enough sources means at least two independent ones for each key claim (or one primary plus a corroborating one). Say plainly when sources disagree or only one source says it."
rollback = "Drop any claim whose source turns out wrong or out of date, and say so."
give_up = [
  "a hard approval was refused",
  "hardware, access or a sign-in is missing",
  "every approach in the playbook failed and was checked",
]

[applies_when]
intent = ["research"]

[[phase]]
name = "Search"
tier = "read_only"

[[phase.step]]
name = "Search more than one source"

[[phase.step]]
name = "Open the original source behind a claim when there is one"

[[phase.step]]
name = "Note each source's date and drop out-of-date ones"

[[phase.step]]
name = "Stop searching when two independent sources agree on each key claim, or three when they conflict; do not keep browsing past that"

[[phase]]
name = "Answer"
tier = "read_only"

[[phase.step]]
name = "Compare what the sources say and name where they disagree"

[[phase.step]]
name = "Give the answer with a link for each claim"
