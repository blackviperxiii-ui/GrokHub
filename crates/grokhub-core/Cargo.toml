[package]
name = "grokhub-core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared GrokHub brain — pair, tasks, frames, inhabit."
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
hex.workspace = true
sha2 = { workspace = true }
# Release updates: verify `SHA256SUMS.minisig` against the shipped public key. No deps.
minisign-verify = "0.3"
# Personality presets (`assets/personalities.toml`, user copies in `{config}/personalities/`).
toml = { version = "1", default-features = false, features = ["std", "parse", "serde", "display"] }
# Pulse source feeds (RSS, Atom, GitHub releases, YouTube). Already in the tree.
quick-xml = { version = "0.41", default-features = false }
# AMR `index.sqlite` FTS5. Same bundled sqlite as grokhub-agent.
rusqlite = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "blocking",
] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ureq = { workspace = true }

# User-only DACL for hub-state.json (pair tokens) — matches secrets.json on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }
