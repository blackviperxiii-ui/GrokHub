# On-device model catalog: the compatibility matrix the setup wizard and the
# picker (`local_picker.rs`) read. Biggest first. Every file is SHA-256 pinned
# to the Hugging Face LFS oid; a download that hashes differently is deleted.
#
# Sizes are MiB. `min_budget` is the usable memory a model needs to be
# Recommended on each kind of memory (dedicated GPU VRAM, Apple unified memory
# at 70% of RAM, or system RAM minus 4 GB); a missing key means never
# Recommended there. `run_mb` is weights + KV at `ctx_default` + overhead: below
# that in RAM + VRAM the model is hidden. `tok_s` is a rough Q4_K_M generation
# speed from public llama.cpp benchmarks; the speed test replaces it.
#
# `drafter` pairs a model with a speculative-decoding draft model
# (`local_draft.rs`): it is only used when the tokenizers hash the same, the
# engine has the flags, both fit, and the speed test finds it faster.
#
# Gemma 4 comes from lmstudio-community's straight Q4_K_M quants of Google's
# weights (ggml-org publishes Q4_0 only). Community fine-tunes and abliterated
# builds are never listed here.

[[model]]
id = "gemma-4-31b-it-q4_k_m"
name = "Gemma 4 31B"
repo = "lmstudio-community/gemma-4-31B-it-GGUF"
file = "gemma-4-31B-it-Q4_K_M.gguf"
sha256 = "8f3479643461601703f717931e399cc440dbd5ada598c025d6296c8165d94be9"
download_mb = 17_822
quant = "Q4_K_M"
license = "Apache-2.0"
badges = ["tools", "vision"]
tier = "T4"
route = "local:small"
ctx_default = 32_768
run_mb = 19_800
needs_avx2 = true
# Speculative decoding with E2B (same family; the tokenizer gate checks it).
drafter = "gemma-4-e2b-it-q4_k_m"
min_budget = { gpu = 20_480, unified = 40_960 }
tok_s = { gpu = 35, unified = 25, cpu = 2 }

