# On-device model catalog: the compatibility matrix the setup wizard and the
# picker (`local_picker.rs`) read. Biggest first. Every file is SHA-256 pinned
# to the Hugging Face LFS oid; a download that hashes differently is deleted.
#
# Sizes are MiB. `min_budget` is the usable memory a model needs to be
# Recommended on each kind of memory (dedicated GPU VRAM, Apple unified memory
# at 70% of RAM, or system RAM minus 4 GB); a missing key means never
# Recommended there. `run_mb` is weights + KV at `ctx_default` + overhead: below
# that in RAM + VRAM the model is hidden. `tok_s` is a rough Q4_K generation
# speed from public llama.cpp benchmarks; the speed test replaces it.
#
# `drafter` pairs a model with a speculative-decoding draft model
# (`local_draft.rs`): it is only used when the engine has the flags, both fit,
# and the speed test finds it faster. Each model's drafter is its own
# abliterated MTP heads file (an id with "mtp"), trained for that one model,
# so the tokenizer check that a separate small model needs doesn't apply.
#
# `remote_file` is the name in the repo when it differs from `file`, the name
# on disk: every repo calls its MTP file the same, and they share a folder.
#
# Every model is an abliterated (refusal-removed) build: huihui-ai's Gemma 4
# QAT abliterated GGUFs (Q4_K quants of Google's QAT q4_0 unquantized weights),
# each pinned by hash. The ids say abliterated, so a stock Gemma file already on
# disk never matches a row. The banned-ask check (`adult_guard.rs` and the
# agent's route screen) runs in front of these like any other model.
#
# `kind` says what a row is for: chat (the default), drafter,
# vision-projector, image, image-guard, speech-to-text, text-to-speech, embed,
# rerank, ocr or guard. Only chat rows count toward the 25 standard models
# (`local_setup::STANDARD_MODEL_CAP`). A drafter or projector names its chat
# model in `pairs_with`.
#
# `abliterated = { by, method }` is required on every chat row: who removed
# the refusals and how (`abliteration` or `heretic`). `refusal_score` is the
# share of the refusal check's prompts the model answered, once measured.
#
# Only the main GGUF downloads; the repos' vision projector
# (`mmproj-model-bf16.gguf`) isn't fetched yet, so no row claims vision.

