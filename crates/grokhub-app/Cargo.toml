[package]
name = "grokhub-app"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
description = "GrokHub native cabin — no Electron, no Tauri"
publish = false

[[bin]]
name = "grokhub"
path = "src/main.rs"

[dependencies]
grokhub-core = { path = "../grokhub-core" }
grokhub-hub = { path = "../grokhub-hub" }
grokhub-agent = { path = "../grokhub-agent" }
grokhub-desktop = { path = "../grokhub-desktop" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
# U7a: in-app toasts for Saved / run-finished / error status lines (egui 0.36).
egui-notify = "0.23"
# U7b: TableBuilder for panel/compare tables (egui 0.36; no image loaders).
egui_extras = { version = "0.36.2", default-features = false }
# U7c: Phosphor icon set for sidebar / cards / bar glyphs (egui 0.36; subset keeps size down).
egui-phosphor = { version = "0.14", default-features = false, features = ["regular", "subset"] }
# U7e: bar charts for existing numeric views (egui ^0.36; no egui/eframe bump).
egui_plot = "0.37"
# U7f: optional dockable main panels (egui ^0.36; serde persists dock.json; no egui/eframe bump).
egui_dock = { version = "0.21", features = ["serde"] }
ureq = { workspace = true }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
global-hotkey = "0.6"
image = { workspace = true, features = ["webp", "ico", "bmp"] }
keyring = { workspace = true }
# SB-04: native folder picker. On Linux only the xdg-desktop-portal backend
# (no GTK, no new system libraries); Windows and macOS use their own dialogs.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
# blocking API; ksni still needs its tokio feature (default) for the async D-Bus service.
ksni = { version = "0.3.6", features = ["blocking"] }
x11rb = { version = "0.13", default-features = false, features = ["randr", "screensaver", "xtest"] }

# The Wayland portal and uinput crates moved to grokhub-desktop.
[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
zbus = { version = "5.19", default-features = false, features = ["blocking-api"] }

# build.rs returns early on non-Windows; default-features pull in toml we do not need.
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
# No libxdo (X11) — that default is for Linux menus and only bloated the lockfile.
tray-icon = { version = "0.19", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
# Diagnostics tests read the saved bundle back.
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
default = ["fx"]
fx = ["eframe/wgpu"]
