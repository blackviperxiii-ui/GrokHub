[package]
name = "grokhub-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GrokHub native cabin — no Electron, no Tauri"

[[bin]]
name = "grokhub"
path = "src/main.rs"

[dependencies]
grokhub-core = { path = "../grokhub-core" }
grokhub-hub = { path = "../grokhub-hub" }
grokhub-acp = { path = "../grokhub-acp" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
base64 = "0.22"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["x11", "wayland"] }
ksni = { version = "0.3.6", features = ["blocking"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_UI_Controls_Dialogs",
] }
