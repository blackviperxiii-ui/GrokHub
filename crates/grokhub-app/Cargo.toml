[package]
name = "grokhub-app"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
description = "GrokHub native cabin — no Electron, no Tauri"

[[bin]]
name = "grokhub"
path = "src/main.rs"

[dependencies]
grokhub-core = { path = "../grokhub-core" }
grokhub-hub = { path = "../grokhub-hub" }
grokhub-agent = { path = "../grokhub-agent" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
keyring = "4"
# SB-04: native folder picker. On Linux only the xdg-desktop-portal backend
# (no GTK, no new system libraries); Windows and macOS use their own dialogs.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
ksni = { version = "0.3.6", features = ["blocking"] }
x11rb = { version = "0.13", features = ["randr", "xtest"] }

# Wayland portal input (Phase 2a). tokio matches the zbus runtime already in
# the tree. reis stays blocking on that same worker; do not enable its tokio
# or async-io features.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "screenshot"] }
reis = { version = "0.7", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
zbus = { version = "5.19", default-features = false, features = ["blocking-api"] }
rustix = { version = "1", default-features = false, features = ["event", "time", "fs", "net"] }
# Absolute uinput (Phase 2b). No tokio feature: the device is blocking evdev.
evdev = { version = "0.13.2", default-features = false }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
xcap = "0.9.8"
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops",
] }

[features]
default = ["fx"]
fx = ["eframe/wgpu"]
